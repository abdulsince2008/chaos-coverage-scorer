[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-coverage-scorer"
version = "0.1.0"
description = "Measure observability coverage by injecting faults and verifying alerts"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "docker>=7.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
    "click>=8.1.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]

[project.scripts]
chaos-scorer = "chaos_scorer.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chaos_scorer*"]

[tool.ruff]
line-length = 100
target-version = "py310"